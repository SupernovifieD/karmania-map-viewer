[workspace]
resolver = "3"
members = ["crates/karmania-core", "crates/karmania-io"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
karmania-core = { path = "crates/karmania-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libm = "0.2.16"
crs-definitions = "0.6.0"
# Default features off: "aeqd" compiles a C file, which a pure-Rust wasm32 build must avoid.
proj4rs = { version = "0.2.1", default-features = false }

# `unsafe_code` is forbidden per crate (`#![forbid(unsafe_code)]` in karmania-core
# and karmania-io), not here, because wasm-bindgen generates unsafe code.
[workspace.lints.rust]
missing_docs = "warn"
unused_must_use = "deny"

# Data problems become findings, never panics, and the core does no I/O.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
