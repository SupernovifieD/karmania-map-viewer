[workspace]
resolver = "3"
members = ["crates/karmania-core"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libm = "0.2.16"

# `unsafe_code` is forbidden per crate (`#![forbid(unsafe_code)]` in karmania-core
# and karmania-io), not here, because wasm-bindgen generates unsafe code.
[workspace.lints.rust]
missing_docs = "warn"
unused_must_use = "deny"

# Data problems become findings, never panics, and the core does no I/O.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
