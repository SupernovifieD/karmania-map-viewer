name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup does not install the toolchain on first use; this reads
      # rust-toolchain.toml (version, components and the wasm32 target).
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The engine's type checks and tests need the built WebAssembly module.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-pack@0.15.0
      - run: pnpm build:wasm
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r --if-present build
      # The browser tests run the engine's real worker in Chromium.
      - name: Install the browser for the end-to-end tests
        run: pnpm --filter @karmania/engine exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # The screenshot tests use the browser in the official Playwright Docker image, so the pixels
      # are the same as on a developer's machine. The script starts the container and stops it.
      - run: pnpm test:visual
      - run: pnpm format:check

  # axe over every state the screenshot tests photograph, in both themes: it takes minutes, so it
  # runs beside the other jobs and not in them.
  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-pack@0.15.0
      # The pages the tests open are built from the packages' built files, and the wizard's states
      # run the engine's real worker.
      - run: pnpm build:wasm
      - run: pnpm -r --if-present build
      - name: Install the browser
        run: pnpm --filter @karmania/engine exec playwright install --with-deps chromium
      - run: pnpm test:axe
