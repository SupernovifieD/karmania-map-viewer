[package]
name = "karmania-wasm"
description = "WebAssembly bindings for Karmania: translation between JavaScript and the Rust kernel, with no logic of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib is the WebAssembly module; rlib lets the unit tests run natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
karmania-core.workspace = true
karmania-io.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
